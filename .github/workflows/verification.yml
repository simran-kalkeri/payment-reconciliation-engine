name: Verify PostgreSQL and isolated demo

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.4'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Configure isolated demo database
        run: |
          database_password="$(openssl rand -hex 24)"
          matcher_password="$(openssl rand -hex 24)"
          echo "::add-mask::$database_password"
          echo "::add-mask::$matcher_password"
          {
            echo "POSTGRES_PASSWORD=$database_password"
            echo "RECON_DATABASE_URL=postgresql+psycopg://reconciliation:$database_password@127.0.0.1:55432/reconciliation"
            echo "RECON_TEST_DATABASE_URL=postgresql+psycopg://reconciliation:$database_password@127.0.0.1:55432/reconciliation"
            echo "RECON_MATCHER_URL=postgresql+psycopg://recon_matcher:$matcher_password@db:5432/reconciliation"
            echo "MATCHER_PASSWORD=$matcher_password"
            echo "RECON_REQUIRE_POSTGRES=1"
          } >> "$GITHUB_ENV"
      - name: Run PostgreSQL tests
        run: |
          docker compose up -d --wait db
          reconcile migrate
          python -m pytest -q
      - name: Run held-out demo in the isolated matcher container
        run: |
          printf "CREATE ROLE recon_matcher LOGIN PASSWORD '%s';\n" "$MATCHER_PASSWORD" |
            docker compose exec -T db psql -v ON_ERROR_STOP=1 -U reconciliation -d reconciliation
          docker compose exec -T db psql -v ON_ERROR_STOP=1 -U reconciliation -d reconciliation < scripts/matcher-grants.sql
          reconcile demo --isolated --retune
          git diff --exit-code -- config/frozen.json
