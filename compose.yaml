services:
  db:
    image: postgres:17.12
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reconciliation}
      POSTGRES_DB: ${POSTGRES_DB:-reconciliation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 20
  matcher:
    profiles: ["isolated"]
    build:
      context: .
      target: matcher
    environment:
      RECON_DATABASE_URL: ${RECON_MATCHER_URL:-}
    read_only: true
    user: "${RECON_MATCHER_UID:-65534}:${RECON_MATCHER_GID:-65534}"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ${RECON_MATCHER_RULES_DIR:-./config}:/app/config:ro
      - ${RECON_MATCHER_EXPORT_DIR:-./artifacts/work/exports}:/exports

volumes:
  database:
